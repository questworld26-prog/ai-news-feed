[project]
name = "ai-news-voice-feed"
version = "0.1.0"
description = "Automated daily AI news briefing pipeline with theme curation, local TTS, anti-hallucination validation, and Telegram delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.14",
    "kokoro-mlx>=0.1.2",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501", # line length
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


